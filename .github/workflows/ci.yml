name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; nothing here needs write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs; mutable tags
      # could be repointed at malicious code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # High-severity advisories in what the site builds and ships with.
      # Ignored: GHSA-ch52-4w7c-c8xp (http-cache-semantics via astro, no
      # fixed release) — it concerns shared HTTP caches, and the build's
      # image cache is a private, single-user one.
      - run: bun audit --prod --audit-level=high --ignore GHSA-ch52-4w7c-c8xp
      - run: bun run format:check
      - run: bun test
      # `build` runs `astro check` first, so there is no separate step.
      - run: bun run build
      - run: bun run check:links
