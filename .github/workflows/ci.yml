name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; nothing here needs write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs (Dependabot bumps
      # them); mutable tags could be repointed at malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run astro check
      - run: bun test
      - run: bun run build
      - run: bun run check:links
